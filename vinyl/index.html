<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vinyl shelf</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <style>
    :root {
      color-scheme: light;
      --ink: #26302b;
      --paper: #f3f0e8;
      --panel: #e6e2d7;
      --line: #cbc5b6;
      --muted: #68726b;
      --accent: #52685f;
      --shadow: 0 12px 35px rgba(38, 48, 43, .12);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.5 Georgia, "Times New Roman", serif;
    }

    .site-header {
      max-width: none;
      margin: auto;
      padding: 3rem clamp(1.25rem, 4vw, 5rem) 1.8rem;
    }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: clamp(2.5rem, 6vw, 4.75rem); font-weight: 400; letter-spacing: -.06em; }
    .intro { margin-top: .4rem; color: var(--muted); }
    .source { margin-top: .3rem; color: var(--muted); font-size: .8rem; }
    .source a { color: inherit; }
    .search {
      width: 100%;
      max-width: 660px;
      margin-top: 2rem;
      padding: .85rem 1rem;
      border: 1px solid var(--line);
      border-radius: .2rem;
      background: #fbfaf6;
      color: inherit;
      font: inherit;
      font-size: 1rem;
      outline-offset: 3px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      max-width: none;
      margin: auto;
      padding: 0 clamp(1.25rem, 4vw, 5rem) 4rem;
      gap: clamp(2rem, 4vw, 4rem);
    }
    .layout.has-details { grid-template-columns: minmax(0, 1fr) minmax(20rem, 23rem); }
    .shelf { min-width: 0; }
    .section + .section { margin-top: 3.8rem; }
    .section-heading { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 1.25rem; }
    h2 { font-size: 1.45rem; font-weight: 400; }
    .count { color: var(--muted); font-size: .9rem; }
    .records {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(clamp(170px, 12vw, 260px), 1fr));
      gap: clamp(1rem, 2.2vw, 1.8rem);
    }
    .record {
      --edge: #a6afa1;
      min-width: 0;
      padding: 0;
      border: 0;
      background: none;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }
    .record:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    .record[aria-pressed="true"] .artwork { transform: translateY(-3px); box-shadow: var(--shadow); }
    .artwork {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      border: 6px solid var(--edge);
      border-radius: .2rem;
      background: #d6d2c8;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .artwork img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .cover-fallback {
      display: grid;
      width: 100%; height: 100%;
      place-items: center;
      padding: 1rem;
      background: radial-gradient(circle, #eee9de 0 15%, #c8c4bb 16% 17%, #494d49 18% 19%, #747a72 20% 33%, #d5d0c4 34%);
      color: #29312d;
      text-align: center;
      font-size: .78rem;
      font-style: italic;
    }
    .record:hover .artwork { transform: translateY(-3px); box-shadow: var(--shadow); }
    .record-title {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      display: block;
      padding: .55rem .65rem;
      background: rgba(24, 29, 26, .82);
      color: #fff;
      font-size: .82rem;
      line-height: 1.25;
    }
    .record-title strong { display: block; font-weight: 400; }
    .record-title span { color: rgba(255, 255, 255, .78); }
    .empty { color: var(--muted); font-style: italic; }

    .details {
      align-self: start;
      position: sticky;
      top: 1.5rem;
      max-height: calc(100vh - 3rem);
      min-height: 25rem;
      padding: 1.5rem;
      border-top: 5px solid var(--accent);
      background: var(--panel);
      box-shadow: 0 1px 0 rgba(255,255,255,.55) inset;
      overflow-y: auto;
      overscroll-behavior: contain;
    }
    .details[hidden] { display: none; }
    .details-artwork { margin: 1.4rem 0 1.5rem; }
    .details-close {
      position: absolute;
      top: .65rem;
      right: .75rem;
      padding: .1rem .35rem;
      border: 0;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font: 1.65rem/1 Arial, sans-serif;
    }
    .details-close:hover { color: var(--ink); }
    .details-close:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .details-placeholder { color: var(--muted); font-style: italic; }
    .details-title { font-size: 1.75rem; line-height: 1.08; font-weight: 400; }
    .details-artist { margin-top: .5rem; color: var(--muted); }
    .metadata { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 1.5rem 0; }
    .metadata div { border-top: 1px solid var(--line); padding-top: .45rem; }
    .metadata dt { color: var(--muted); font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; }
    .metadata dd { margin: .15rem 0 0; font-size: .92rem; }
    .tracks-title { margin: 1.65rem 0 .65rem; font-size: 1.1rem; font-weight: 400; }
    .side + .side { margin-top: 1.1rem; }
    .side h3 { color: var(--accent); font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; }
    .tracks { margin: .3rem 0 0; padding: 0; list-style: none; }
    .tracks li { display: grid; grid-template-columns: 2.4rem 1fr auto; gap: .35rem; padding: .25rem 0; border-bottom: 1px solid rgba(203,197,182,.65); font-size: .88rem; }
    .position, .duration { color: var(--muted); font-variant-numeric: tabular-nums; }
    .duration { text-align: right; }
    .error { color: #873d39; }

    @media (max-width: 820px) {
      .layout.has-details { grid-template-columns: 1fr; }
      .details { position: static; order: -1; min-height: 0; }
      .details-close {
        position: sticky;
        top: 0;
        display: block;
        margin-left: auto;
        z-index: 1;
        background: var(--panel);
      }
      .details-artwork { margin-top: .5rem; }
    }
    @media (max-width: 440px) {
      .records { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metadata { grid-template-columns: 1fr; gap: .65rem; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <h1>Vinyl shelf</h1>
    <p class="intro">Records I am looking for and records at home.</p>
    <p class="source">Data provided by <a href="https://www.discogs.com/">Discogs</a>.</p>
    <input class="search" id="search" type="search" placeholder="Search albums, artists, years, or tracks" aria-label="Search records" autocomplete="off">
  </header>

  <main class="layout">
    <div class="shelf">
      <section class="section" aria-labelledby="wanted-heading">
        <div class="section-heading"><h2 id="wanted-heading">Discs I want</h2><span class="count" id="wanted-count"></span></div>
        <div class="records" id="wanted-records"></div>
      </section>
      <section class="section" aria-labelledby="owned-heading">
        <div class="section-heading"><h2 id="owned-heading">Discs I have</h2><span class="count" id="owned-count"></span></div>
        <div class="records" id="owned-records"></div>
      </section>
    </div>
    <aside class="details" id="details" aria-live="polite" hidden></aside>
  </main>

  <script>
    const sections = ["wanted", "owned"];
    const edgeColors = ["#aab7aa", "#b6a39b", "#a8b4c0", "#b7ae8d", "#b39ead"];
    let records = [];
    let selectedId = null;

    const artistName = record => (record.artists || []).map(artist => artist.name.replace(/ \(\d+\)$/, "")).join(", ") || "Unknown artist";
    const imageUrl = record => (record.images || []).find(image => image.type === "primary")?.uri || record.thumb;
    const format = record => (record.formats || []).map(item => [item.qty, item.name, ...(item.descriptions || [])].filter(Boolean).join(" ")).join(", ");
    const releaseYear = record => record.year || (record.released || "").slice(0, 4) || "—";
    const releaseYearNumber = record => Number.parseInt(releaseYear(record), 10) || Number.MAX_SAFE_INTEGER;
    const matchingText = record => [record.title, artistName(record), releaseYear(record), ...(record.genres || []), ...(record.styles || []), ...(record.tracklist || []).map(track => track.title)].join(" ").toLocaleLowerCase();

    function fallback(record) {
      const cover = document.createElement("div");
      cover.className = "cover-fallback";
      cover.textContent = record.title;
      return cover;
    }

    function artwork(record) {
      const cover = document.createElement("div");
      cover.className = "artwork";
      const url = imageUrl(record);
      if (!url) return cover.appendChild(fallback(record)), cover;
      const image = new Image();
      image.src = url;
      image.alt = `${record.title} cover`;
      image.addEventListener("error", () => image.replaceWith(fallback(record)), { once: true });
      cover.appendChild(image);
      return cover;
    }

    function recordCard(record, index) {
      const button = document.createElement("button");
      button.className = "record";
      button.type = "button";
      button.style.setProperty("--edge", edgeColors[index % edgeColors.length]);
      button.setAttribute("aria-pressed", String(record.id === selectedId));
      const cover = artwork(record);
      const caption = document.createElement("span");
      caption.className = "record-title";
      const title = document.createElement("strong");
      title.textContent = record.title;
      const details = document.createElement("span");
      details.textContent = `${artistName(record)} (${releaseYear(record)})`;
      caption.append(title, details);
      cover.appendChild(caption);
      button.appendChild(cover);
      button.addEventListener("click", () => selectRecord(record));
      return button;
    }

    function tracksBySide(tracklist) {
      return (tracklist || []).reduce((sides, track) => {
        if (track.type_ && track.type_ !== "track") return sides;
        const side = (track.position || "Tracks").match(/^([A-Z]+)/)?.[1] || "Tracks";
        (sides[side] ||= []).push(track);
        return sides;
      }, {});
    }

    function closeDetails() {
      selectedId = null;
      render();
    }

    function selectRecord(record) {
      selectedId = record.id;
      render();
      if (window.matchMedia("(max-width: 820px)").matches) {
        document.getElementById("details").scrollIntoView({
          behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
          block: "start"
        });
      }
    }

    function renderDetails(record) {
      const panel = document.getElementById("details");
      const layout = document.querySelector(".layout");
      panel.replaceChildren();
      if (!record) {
        panel.hidden = true;
        layout.classList.remove("has-details");
        return;
      }
      panel.hidden = false;
      layout.classList.add("has-details");
      const close = document.createElement("button");
      close.className = "details-close";
      close.type = "button";
      close.setAttribute("aria-label", "Close album details");
      close.textContent = "×";
      close.addEventListener("click", event => { event.stopPropagation(); closeDetails(); });
      const cover = artwork(record);
      cover.classList.add("details-artwork");
      const title = document.createElement("h2");
      title.className = "details-title";
      title.textContent = record.title;
      const artist = document.createElement("p");
      artist.className = "details-artist";
      artist.textContent = artistName(record);
      const metadata = document.createElement("dl");
      metadata.className = "metadata";
      [["Released", record.released_formatted || record.released || releaseYear(record)], ["Format", format(record) || "—"], ["Label", (record.labels || []).map(label => label.name).join(", ") || "—"], ["Style", [...(record.genres || []), ...(record.styles || [])].join(", ") || "—"]].forEach(([label, value]) => {
        const item = document.createElement("div");
        const term = document.createElement("dt"); term.textContent = label;
        const description = document.createElement("dd"); description.textContent = value;
        item.append(term, description); metadata.appendChild(item);
      });
      const tracksTitle = document.createElement("h3");
      tracksTitle.className = "tracks-title";
      tracksTitle.textContent = "Track listing";
      panel.append(close, cover, title, artist, metadata, tracksTitle);
      const sides = tracksBySide(record.tracklist);
      Object.entries(sides).forEach(([side, tracks]) => {
        const group = document.createElement("section"); group.className = "side";
        const heading = document.createElement("h3"); heading.textContent = side === "Tracks" ? side : `Disc ${side}`;
        const list = document.createElement("ol"); list.className = "tracks";
        tracks.forEach(track => {
          const item = document.createElement("li");
          [["position", track.position || ""], ["track-name", track.title || "Untitled"], ["duration", track.duration || ""]].forEach(([className, value]) => {
            const part = document.createElement("span"); part.className = className; part.textContent = value; item.appendChild(part);
          });
          list.appendChild(item);
        });
        group.append(heading, list); panel.appendChild(group);
      });
      if (!Object.keys(sides).length) {
        const missing = document.createElement("p"); missing.className = "details-placeholder"; missing.textContent = "No track listing in this release data."; panel.appendChild(missing);
      }
    }

    function render() {
      const query = document.getElementById("search").value.trim().toLocaleLowerCase();
      sections.forEach(section => {
        const matches = records
          .filter(record => record.section === section && (!query || matchingText(record).includes(query)))
          .sort((first, second) => releaseYearNumber(first) - releaseYearNumber(second) || first.title.localeCompare(second.title));
        const container = document.getElementById(`${section}-records`);
        container.replaceChildren();
        document.getElementById(`${section}-count`).textContent = `${matches.length} ${matches.length === 1 ? "record" : "records"}`;
        if (!matches.length) {
          const empty = document.createElement("p"); empty.className = "empty"; empty.textContent = "No records found."; container.appendChild(empty);
        } else matches.forEach((record, index) => container.appendChild(recordCard(record, index)));
      });
      renderDetails(records.find(record => record.id === selectedId));
    }

    document.getElementById("search").addEventListener("input", render);
    document.addEventListener("click", event => {
      const details = document.getElementById("details");
      if (!details.hidden && !details.contains(event.target) && !event.target.closest(".record")) closeDetails();
    });
    fetch("./records.json")
      .then(response => response.ok ? response.json() : Promise.reject(new Error("Could not load records.json")))
      .then(data => {
        records = sections.flatMap(section => (data[section] || []).map(record => ({ ...record, section })));
        render();
      })
      .catch(error => {
        const details = document.getElementById("details");
        details.replaceChildren();
        details.hidden = false;
        document.querySelector(".layout").classList.add("has-details");
        const message = document.createElement("p"); message.className = "error"; message.textContent = error.message; details.appendChild(message);
      });
  </script>
</body>
</html>
